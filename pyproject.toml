[project]
name = "crossfade"
version = "0.1.0"
description = "Traces your app, has a coding agent change what the traces point to, and keeps the change only if it tests better."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Hinterland Labs" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
crossfade = "crossfade.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossfade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/crossfade"]
